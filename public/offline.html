<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Smart Living - Offline</title>
    <meta name="theme-color" content="#0f766e" />
    <style>
      :root {
        color-scheme: light;
        --bg: #f6fbfb;
        --card: #ffffff;
        --text: #0f172a;
        --muted: #475569;
        --accent: #0f766e;
        --border: #dbe4e8;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: radial-gradient(circle at top, #d6f3f0 0%, var(--bg) 55%);
        font-family:
          Segoe UI,
          system-ui,
          -apple-system,
          sans-serif;
        color: var(--text);
        padding: 1rem;
      }
      .card {
        max-width: 34rem;
        width: 100%;
        border: 1px solid var(--border);
        border-radius: 1rem;
        background: var(--card);
        box-shadow: 0 20px 50px rgba(15, 118, 110, 0.12);
        padding: 1.5rem;
      }
      h1 {
        margin: 0 0 0.75rem;
        font-size: 1.5rem;
      }
      p {
        margin: 0.5rem 0;
        color: var(--muted);
        line-height: 1.55;
      }
      button {
        margin-top: 1rem;
        border: 0;
        border-radius: 999px;
        background: var(--accent);
        color: #fff;
        padding: 0.7rem 1rem;
        font-size: 0.95rem;
        cursor: pointer;
      }
      button:hover {
        opacity: 0.95;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>You are offline</h1>
      <p>
        Smart Living is currently unable to reach the internet. You can still
        open pages that were visited before.
      </p>
      <p>
        Reconnect and tap retry to continue searching listings and managing
        bookings.
      </p>
      <button type="button" onclick="window.location.reload()">Retry</button>
    </main>
  </body>
</html>
